name: Build and deploy OpenVLC Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'vite.config.js'
      - '.github/workflows/build-academy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Check out pinned OpenVLC implementation
        uses: actions/checkout@v4
        with:
          repository: luckyprinter/OpenVLC-Public
          ref: 411f183a8592d8285118f613bb4909c5bbd9d3cc
          path: .upstream
          persist-credentials: false
      - name: Verify source references and index
        run: |
          npm run test:source -- .upstream
          python3 scripts/verify-repo-index.py .upstream
      - name: Install Chromium for responsive checks
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify generated entry point
        run: test -s dist/index.html
      - name: Run responsive and interaction smoke tests
        run: npm run test:visual
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-responsive-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
